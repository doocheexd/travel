<style>

/* sql drawer */
.drawer-btn{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--code-bg);color:var(--code-fg);border:0;border-radius:999px;padding:10px 16px;font-family:var(--mono);font-size:13px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25)}

.drawer header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.12);font-size:13px}

<script>
"use strict";
/* ================= 資料庫層 ================= */
const STORE_KEY = "travel-db-v2";
let SQL, db;
const sqlLog = [];
let drawerOpen = false;

const SCHEMA = `
CREATE TABLE Users(
  user_id INTEGER PRIMARY KEY AUTOINCREMENT,
  username VARCHAR(50) NOT NULL UNIQUE,
  password_hash VARCHAR(255) NOT NULL,
  email VARCHAR(100) NOT NULL UNIQUE,
  created_at DATETIME DEFAULT CURRENT_TIMESTAMP
);
CREATE TABLE Trips(
  trip_id INTEGER PRIMARY KEY AUTOINCREMENT,
  owner_id INTEGER NOT NULL REFERENCES Users(user_id),
  title VARCHAR(100) NOT NULL,
  destination VARCHAR(50),
  start_date DATE NOT NULL,
  end_date DATE NOT NULL,
  budget DECIMAL(10,2) DEFAULT 0,
  created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
  CHECK (end_date >= start_date)
);
CREATE TABLE TripMembers(
  trip_id INTEGER NOT NULL REFERENCES Trips(trip_id) ON DELETE CASCADE,
  user_id INTEGER NOT NULL REFERENCES Users(user_id) ON DELETE CASCADE,
  role VARCHAR(10) NOT NULL CHECK (role IN ('owner','editor','viewer')),
  joined_at DATETIME DEFAULT CURRENT_TIMESTAMP,
  PRIMARY KEY (trip_id, user_id)
);
CREATE TABLE TripDays(
  day_id INTEGER PRIMARY KEY AUTOINCREMENT,
  trip_id INTEGER NOT NULL REFERENCES Trips(trip_id) ON DELETE CASCADE,
  day_number TINYINT NOT NULL,
  trip_date DATE NOT NULL,
  memo VARCHAR(200),
  UNIQUE (trip_id, day_number)
);
CREATE TABLE Categories(
  category_id INTEGER PRIMARY KEY,
  category_name VARCHAR(20) NOT NULL UNIQUE
);
CREATE TABLE Places(
  place_id INTEGER PRIMARY KEY AUTOINCREMENT,
  category_id INTEGER NOT NULL REFERENCES Categories(category_id),
  name VARCHAR(100) NOT NULL,
  address VARCHAR(200),
  phone VARCHAR(20),
  open_hours VARCHAR(100)
);
CREATE TABLE ItineraryItems(
  item_id INTEGER PRIMARY KEY AUTOINCREMENT,
  day_id INTEGER NOT NULL REFERENCES TripDays(day_id) ON DELETE CASCADE,
  place_id INTEGER REFERENCES Places(place_id) ON DELETE SET NULL,
  start_time TIME,
  end_time TIME,
  sort_order TINYINT NOT NULL DEFAULT 1,
  transport VARCHAR(20),
  notes VARCHAR(255),
  CHECK (start_time IS NULL OR end_time IS NULL OR end_time > start_time)
);
CREATE TABLE Expenses(
  expense_id INTEGER PRIMARY KEY AUTOINCREMENT,
  trip_id INTEGER NOT NULL REFERENCES Trips(trip_id) ON DELETE CASCADE,
  paid_by INTEGER NOT NULL REFERENCES Users(user_id),
  amount DECIMAL(10,2) NOT NULL CHECK (amount > 0),
  expense_type VARCHAR(20) NOT NULL,
  note VARCHAR(100),
  spent_on DATE
);`;

function fmtSQL(sql, params) {
  let i = 0;
  const s = sql.replace(/\s+/g, " ").trim();
  if (!params || !params.length) return s;
  return s.replace(/\?/g, () => {
    const v = params[i++];
    if (v === null || v === undefined) return "NULL";
    if (typeof v === "number") return String(v);
    return "'" + String(v).replace(/'/g, "''") + "'";
  });
}
function logSQL(text, kind) {
  sqlLog.unshift({ text, kind: kind || "r", t: new Date().toLocaleTimeString("zh-TW", { hour12: false }) });
  if (sqlLog.length > 80) sqlLog.pop();
}
/** 查詢：回傳物件陣列 */
function q(sql, params = [], silent) {
  if (!silent) logSQL(fmtSQL(sql, params));
  const st = db.prepare(sql);
  st.bind(params);
  const rows = [];
  while (st.step()) rows.push(st.getAsObject());
  st.free();
  return rows;
}
function q1(sql, params, silent) { return q(sql, params, silent)[0]; }
/** 寫入：INSERT / UPDATE / DELETE */
function run(sql, params = []) {
  logSQL(fmtSQL(sql, params), "w");
  db.run(sql, params);
  return db.exec("SELECT last_insert_rowid() AS id")[0].values[0][0];
}
function tx(fn) {
  db.run("BEGIN");
  try { const r = fn(); db.run("COMMIT"); save(); return r; }
  catch (e) { db.run("ROLLBACK"); logSQL("錯誤：" + e.message, "err"); throw e; }
}
function save() {
  try {
    const bytes = db.export();
    db.run("PRAGMA foreign_keys = ON");
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    localStorage.setItem(STORE_KEY, btoa(bin));
  } catch (e) { db.run("PRAGMA foreign_keys = ON"); }
}
function loadSaved() {
  try {
    const b = localStorage.getItem(STORE_KEY);
    if (!b) return null;
    const bin = atob(b), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  } catch (e) { return null; }
}
async function sha256(s) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { // 備用：簡易雜湊（非安全情境）
    let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return "djb2$" + h.toString(16);
  }
}
function addDays(iso, n) {
  const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function dayDiff(a, b) { return Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 86400000); }

async function seed() {
  db.run(SCHEMA);
  db.run("PRAGMA foreign_keys = ON");
  const pw = await sha256("1234");
  const users = [["amy", "amy@example.com"], ["ben", "ben@example.com"], ["cindy", "cindy@example.com"]];
  users.forEach(u => db.run("INSERT INTO Users(username,password_hash,email) VALUES(?,?,?)", [u[0], pw, u[1]]));
  ["景點", "餐廳", "住宿", "交通", "購物"].forEach((c, i) => db.run("INSERT INTO Categories VALUES(?,?)", [i + 1, c]));
  const places = [
    [1, "赤崁樓", "台南市中西區民族路二段212號"], [1, "安平古堡", "台南市安平區國勝路82號"],
    [1, "神農街", "台南市中西區神農街"], [1, "奇美博物館", "台南市仁德區文華路二段66號"],

let toastTimer;
function toast(msg, err) {
  clearTimeout(toastTimer);
  const el = document.createElement("div"); el.className = "toast" + (err ? " err" : ""); el.textContent = msg;
  document.querySelectorAll(".toast").forEach(t => t.remove()); document.body.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), 2600);
}
function friendlyErr(e) {
  const m = e.message || String(e);
  if (/UNIQUE.*username/.test(m)) return "這個帳號名稱已被使用";
  if (/UNIQUE.*email/.test(m)) return "這個電子郵件已被註冊";
  if (/UNIQUE.*TripMembers|PRIMARY KEY/.test(m)) return "這位使用者已經是旅伴了";
  if (/CHECK/.test(m) && /end_date/.test(m)) return "結束日期不可早於出發日期";
  if (/CHECK/.test(m) && /amount/.test(m)) return "金額必須大於 0";
  if (/CHECK/.test(m) && /end_time/.test(m)) return "結束時間必須晚於開始時間";
  if (/CHECK constraint failed/.test(m)) return "資料不符合限制條件：" + m;
  if (/FOREIGN KEY/.test(m)) return "有其他資料參照這筆資料，無法完成";
  return m;
}
function attempt(fn, okMsg) {
  try { const r = fn(); if (okMsg) toast(okMsg); render(); return r; }
  catch (e) { toast(friendlyErr(e), true); render(); return undefined; }
}

function syncDays(tripId, start, end) {
  const n = dayDiff(start, end) + 1;
  if (n > 30) throw new Error("行程最多 30 天");
  run("DELETE FROM TripDays WHERE trip_id = ? AND day_number > ?", [tripId, n]);
  for (let i = 1; i <= n; i++) {
    const ex = q1("SELECT day_id FROM TripDays WHERE trip_id = ? AND day_number = ?", [tripId, i], true);
    if (ex) run("UPDATE TripDays SET trip_date = ? WHERE day_id = ?", [addDays(start, i - 1), ex.day_id]);
    else run("INSERT INTO TripDays(trip_id, day_number, trip_date) VALUES(?, ?, ?)", [tripId, i, addDays(start, i - 1)]);
  }
}

      run("INSERT INTO TripMembers(trip_id, user_id, role) VALUES(?, ?, 'owner')", [id, S.user.user_id]);
      syncDays(id, d.start_date, d.end_date);
      return id;
    }), "已建立行程");
    if (id) { openTrip(id); }
    return id ? true : false;
  });
}

function expensesHTML(t, role) {

  const budget = Number(t.budget) || 0, total = Number(sum.total), share = members.length ? total / members.length : 0;

    <div class="kpi"><div class="l">每人平均分攤（${members.length} 人）</div><div class="v">${money(share)}</div></div>

  <div class="split"><div style="display:grid;gap:16px;min-width:0">
    ${editable ? `<form id="exp-form" class="panel" style="display:grid;gap:10px"><h3 style="font-size:16px">新增花費</h3>
      <div class="grid2"><label class="f">金額<input id="ex-amt" type="number" name="amount" min="1" step="1" required></label>
      <label class="f">類型<select id="ex-type" name="expense_type">${["餐飲", "交通", "住宿", "門票", "購物", "其他"].map(x => `<option>${x}</option>`).join("")}</select></label>
      <label class="f">付款人<select id="ex-payer" name="paid_by">${members.map(m => `<option value="${m.user_id}" ${m.user_id === S.user.user_id ? "selected" : ""}>${esc(m.username)}</option>`).join("")}</select></label>
      <label class="f">日期<input id="ex-date" type="date" name="spent_on" value="${esc(t.start_date)}" min="${esc(t.start_date)}" max="${esc(t.end_date)}"></label></div>
      <label class="f">說明<input id="ex-note" name="note" maxlength="100"></label>
      <div><button class="btn">新增花費</button></div></form>` : ""}
    <div class="tablewrap"><table class="data"><thead><tr><th>日期</th><th>類型</th><th>說明</th><th>付款人</th><th style="text-align:right">金額</th>${editable ? "<th></th>" : ""}</tr></thead><tbody>
      ${list.length ? list.map(e => `<tr><td class="num">${md(e.spent_on)}</td><td><span class="pill">${esc(e.expense_type)}</span></td><td>${esc(e.note)}</td><td>${esc(e.username)}</td><td class="n">${money(e.amount)}</td>${editable ? `<td><button class="btn sm danger" data-del-exp="${e.expense_id}">刪除</button></td>` : ""}</tr>`).join("") : `<tr><td colspan="6" class="muted">還沒有花費紀錄</td></tr>`}
    </tbody></table></div>

      <div class="bars">${byType.length ? byType.map(b => `<div class="barrow"><span>${esc(b.expense_type)}</span><div class="track"><div class="fill" style="width:${(b.s / maxT * 100).toFixed(1)}%"></div></div><span class="num" style="text-align:right">${money(b.s)}</span></div>`).join("") : `<span class="muted">尚無資料</span>`}</div></div>

function overviewHTML(t) {

/* ---- 資料庫主控台 ---- */
const TABLES = ["Users", "Trips", "TripMembers", "TripDays", "ItineraryItems", "Places", "Categories", "Expenses"];

  ["最常被安排的景點", "SELECT p.name AS 景點, c.category_name AS 類別, COUNT(i.item_id) AS 次數\nFROM Places p\nJOIN Categories c ON c.category_id = p.category_id\nLEFT JOIN ItineraryItems i ON i.place_id = p.place_id\nGROUP BY p.place_id\nORDER BY 次數 DESC\nLIMIT 5;"],
  ["某行程的完整時程", "SELECT d.day_number AS 天, d.trip_date AS 日期, i.start_time AS 開始, IFNULL(p.name, i.notes) AS 項目\nFROM TripDays d\nJOIN ItineraryItems i ON i.day_id = d.day_id\nLEFT JOIN Places p ON p.place_id = i.place_id\nWHERE d.trip_id = 1\nORDER BY d.day_number, i.sort_order;"],
  ["旅伴與角色（多對多）", "SELECT t.title AS 行程, u.username AS 旅伴, m.role AS 角色\nFROM TripMembers m\nJOIN Trips t ON t.trip_id = m.trip_id\nJOIN Users u ON u.user_id = m.user_id\nORDER BY t.trip_id;"],
];

  const r = S.sqlResult;
  return `<h2 class="page">資料庫主控台</h2><div class="muted" style="margin-bottom:16px">直接對系統的 SQLite 資料庫下 SQL，報告時可以示範 JOIN、GROUP BY 與資料表結構</div>

  </div>

      </tbody></table></div></div>

      <div><button class="btn ghost" data-act="reset">重設為範例資料</button></div></div>

function runSQL() {
  const text = document.getElementById("sql-text").value; S.sqlText = text;
  logSQL(text.replace(/\s+/g, " ").trim(), /^\s*select|^\s*pragma|^\s*with/i.test(text) ? "r" : "w");
  try {
    const before = db.getRowsModified ? null : null;
    const sets = db.exec(text);
    const changes = db.getRowsModified();
    if (!/^\s*(select|with|pragma)/i.test(text)) save();
    S.sqlResult = { sets, changes };
  } catch (e) { S.sqlResult = { error: "SQL 錯誤：" + e.message }; logSQL("錯誤：" + e.message, "err"); }
  render();
}

/* ---- SQL 紀錄抽屜 ---- */
function drawerHTML() {
  return `<button class="drawer-btn" data-drawer aria-expanded="${drawerOpen}">SQL 紀錄 ${sqlLog.length}</button>
  ${drawerOpen ? `<div class="drawer" role="dialog" aria-label="SQL 紀錄"><header><span>系統剛剛執行的 SQL（新的在上面）</span><span class="row" style="gap:6px"><button data-clear-log>清空</button><button data-drawer>關閉</button></span></header>
    <div class="log">${sqlLog.length ? sqlLog.map(e => `<div class="e ${e.kind}"><div class="t">${e.t}${e.kind === "w" ? "　寫入" : e.kind === "err" ? "　錯誤" : ""}</div>${esc(e.text)}</div>`).join("") : '<div class="t">尚無紀錄，操作系統後這裡會顯示對應的 SQL。</div>'}</div></div>` : ""}`;
}
function bindDrawer() {
  document.querySelectorAll("[data-drawer]").forEach(b => b.onclick = () => { drawerOpen = !drawerOpen; S.user ? render() : refreshDrawerOnly(); });
  document.querySelector("[data-clear-log]")?.addEventListener("click", () => { sqlLog.length = 0; S.user ? render() : refreshDrawerOnly(); });
}
function refreshDrawerOnly() { document.querySelectorAll(".drawer-btn,.drawer").forEach(e => e.remove()); $app.insertAdjacentHTML("beforeend", drawerHTML()); bindDrawer(); }

/* ================= 事件 ================= */
function afterRender() {
  bindDrawer();
  const m = document.getElementById("main"); if (!m) return;
  // item form
  const f = document.getElementById("item-form");
  if (f) f.addEventListener("submit", ev => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    const vals = [d.place_id ? Number(d.place_id) : null, d.start_time || null, d.end_time || null, d.transport.trim() || null, d.notes.trim() || null];
    if (!vals[0] && !vals[4]) { toast("請選擇景點，或在備註寫下項目名稱", true); return; }
    if (S.editItem) {
      const id = S.editItem;
      if (attempt(() => tx(() => run("UPDATE ItineraryItems SET place_id = ?, start_time = ?, end_time = ?, transport = ?, notes = ? WHERE item_id = ?", [...vals, id])), "已更新行程項目") !== undefined) { S.editItem = null; render(); }
    } else {
      attempt(() => tx(() => {
        const mx = q1("SELECT IFNULL(MAX(sort_order),0) AS m FROM ItineraryItems WHERE day_id = ?", [S.dayId]).m;
        run("INSERT INTO ItineraryItems(day_id, place_id, start_time, end_time, transport, notes, sort_order) VALUES(?, ?, ?, ?, ?, ?, ?)", [S.dayId, ...vals, mx + 1]);
      }), "已新增行程項目");
    }
  });
  const inv = document.getElementById("invite-form");
  if (inv) inv.addEventListener("submit", ev => {
    ev.preventDefault(); const d = Object.fromEntries(new FormData(inv));
    const u = q1("SELECT user_id FROM Users WHERE username = ?", [d.username.trim()]);
    if (!u) { toast("找不到帳號「" + d.username.trim() + "」", true); return; }
    attempt(() => tx(() => run("INSERT INTO TripMembers(trip_id, user_id, role) VALUES(?, ?, ?)", [S.tripId, u.user_id, d.role])), "已邀請 " + d.username.trim());
  });
  const ef = document.getElementById("exp-form");
  if (ef) ef.addEventListener("submit", ev => {
    ev.preventDefault(); const d = Object.fromEntries(new FormData(ef));
    attempt(() => tx(() => run("INSERT INTO Expenses(trip_id, paid_by, amount, expense_type, note, spent_on) VALUES(?, ?, ?, ?, ?, ?)", [S.tripId, Number(d.paid_by), Number(d.amount), d.expense_type, d.note.trim() || null, d.spent_on || null])), "已新增花費");
  });
  const pq = document.getElementById("pl-q");
  if (pq) { pq.addEventListener("input", () => { S.placeQ = pq.value.trim(); const pos = pq.selectionStart; render(); const n = document.getElementById("pl-q"); n.focus(); n.setSelectionRange(pos, pos); }); }
  const pc = document.getElementById("pl-cat"); if (pc) pc.onchange = () => { S.placeCat = pc.value; render(); };
  const st = document.getElementById("sql-text"); if (st) st.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); runSQL(); } });
  document.querySelectorAll("[data-role]").forEach(s => s.onchange = () => attempt(() => tx(() => run("UPDATE TripMembers SET role = ? WHERE trip_id = ? AND user_id = ?", [s.value, S.tripId, Number(s.dataset.role)])), "已變更角色"));
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("button"); if (!el || !$app.contains(el) && !$layer.contains(el)) return;
  const D = el.dataset;
  if (D.go) { S.view = D.go; S.editItem = null; render(); window.scrollTo(0, 0); return; }
  if (D.open) return openTrip(Number(D.open));
  if (D.expOpen) { openTrip(Number(D.expOpen)); S.tab = "expenses"; render(); return; }
  if (D.tab) { S.tab = D.tab; S.editItem = null; render(); return; }
  if (D.day) { S.dayId = Number(D.day); S.editItem = null; render(); return; }
  if (D.editItem) { S.editItem = Number(D.editItem); render(); document.getElementById("if-place")?.focus(); return; }
  if (D.move) {
    const id = Number(D.move), dir = Number(D.dir);
    const items = q("SELECT item_id, sort_order FROM ItineraryItems WHERE day_id = ? ORDER BY sort_order, start_time", [S.dayId], true);
    const k = items.findIndex(i => i.item_id === id), o = items[k + dir]; if (!o) return;
    attempt(() => tx(() => { items.forEach((it, idx) => it.sort_order = idx + 1); const a = items[k], b = items[k + dir];
      run("UPDATE ItineraryItems SET sort_order = ? WHERE item_id = ?", [b.sort_order, a.item_id]); run("UPDATE ItineraryItems SET sort_order = ? WHERE item_id = ?", [a.sort_order, b.item_id]);
      items.forEach((it, idx) => { if (it !== a && it !== b) run("UPDATE ItineraryItems SET sort_order = ? WHERE item_id = ?", [idx + 1, it.item_id]); }); }));
    return;
  }
  if (D.delItem) { const id = Number(D.delItem); confirmBox("刪除這個行程項目？", "刪除後無法復原。", "刪除", () => attempt(() => tx(() => run("DELETE FROM ItineraryItems WHERE item_id = ?", [id])), "已刪除")); return; }
  if (D.delExp) { const id = Number(D.delExp); attempt(() => tx(() => run("DELETE FROM Expenses WHERE expense_id = ?", [id])), "已刪除花費"); return; }
  if (D.kick) { const uid = Number(D.kick); confirmBox("移除這位旅伴？", "對方將看不到這個行程，他記錄的花費仍會保留。", "移除", () => attempt(() => tx(() => run("DELETE FROM TripMembers WHERE trip_id = ? AND user_id = ?", [S.tripId, uid])), "已移除旅伴")); return; }
  if (D.addPlace) return addPlaceToTrip(Number(D.addPlace));
  if (D.example) { S.sqlText = EXAMPLES[Number(D.example)][1]; render(); runSQL(); return; }
  if (D.browse) { S.sqlText = `SELECT * FROM ${D.browse};`; render(); runSQL(); return; }
  if (D.ddl) { const r = q1("SELECT sql FROM sqlite_master WHERE type = 'table' AND name = ?", [D.ddl]); modal(`<h3>${esc(D.ddl)} 的建表語法</h3><pre class="code">${esc(r.sql)}</pre><div class="acts"><button type="button" class="btn" data-close>關閉</button></div>`, () => {}); return; }
  switch (D.act) {
    case "logout": S.user = null; S.view = "trips"; render(); return;
    case "newTrip": return newTrip();
    case "newPlace": return newPlace();
    case "cancelEdit": S.editItem = null; render(); return;
    case "runSQL": return runSQL();
    case "editTrip": { const t = getTrip(); modal(tripForm(t), d => attempt(() => tx(() => {
        run("UPDATE Trips SET title = ?, destination = ?, start_date = ?, end_date = ?, budget = ? WHERE trip_id = ?", [d.title.trim(), d.destination.trim() || null, d.start_date, d.end_date, Number(d.budget) || 0, S.tripId]);
        syncDays(S.tripId, d.start_date, d.end_date); }), "已更新行程") !== undefined); return; }
    case "delTrip": { const t = getTrip(); confirmBox("刪除「" + t.title + "」？", "這個行程的天數、行程項目、旅伴與花費紀錄會一起刪除（ON DELETE CASCADE），無法復原。", "刪除行程", () => { attempt(() => tx(() => run("DELETE FROM Trips WHERE trip_id = ?", [S.tripId])), "已刪除行程"); S.view = "trips"; render(); }); return; }
    case "memo": { const d = q1("SELECT memo FROM TripDays WHERE day_id = ?", [S.dayId], true); modal(`<h3>當日備忘</h3><label class="f">內容<input name="memo" maxlength="200" value="${esc(d.memo)}"></label><div class="acts"><button type="button" class="btn plain" data-close>取消</button><button class="btn">儲存</button></div>`, v => attempt(() => tx(() => run("UPDATE TripDays SET memo = ? WHERE day_id = ?", [v.memo.trim() || null, S.dayId])), "已儲存備忘") !== undefined); return; }
    case "reset": confirmBox("重設為範例資料？", "你新增或修改的所有資料都會清除，回到最初的範例行程。", "重設", async () => { await resetDB(); S.user = q1("SELECT user_id, username, email FROM Users WHERE username = ?", [S.user.username], true) || null; S.view = S.user ? "sql" : "trips"; S.sqlResult = null; toast("已重設為範例資料"); render(); }); return;
  }
});

initDB().then(() => render()).catch(e => { $app.innerHTML = `<div class="loading"><div><p>資料庫引擎載入失敗：${esc(e.message)}</p><p class="muted">請重新整理頁面再試一次。</p></div></div>`; });
</script>

</body></html>
